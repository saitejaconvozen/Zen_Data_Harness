<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Zen Refinement Studio</title><link rel="stylesheet" href="/styles.css"></head><body><header><div><p class="eyebrow">ZEN DATA FACTORY</p><h1>Refinement studio</h1><p id="runline">Loading governed run…</p></div><nav><button class="tab active" data-view="conversations">Conversations</button><button class="tab" data-view="metrics">Pass / fail metrics</button></nav></header><section id="notice"></section><section id="stats"></section><main id="conversationView"><aside><div class="controls"><input id="search" type="search" placeholder="Search domain, language, ID"><select id="outcome"><option value="ALL">All review outcomes</option><option value="PASS">PASS — independently verified</option><option value="FAIL">FAIL — quarantined/rejected</option><option value="PENDING">PENDING — still processing</option></select><select id="status"><option value="ALL">All pipeline statuses</option></select><select id="change"><option value="ALL">All conversations</option><option value="CHANGED">Has assistant changes</option><option value="UNCHANGED">No assistant changes</option></select></div><div id="conversationList"></div></aside><section id="detail"><div class="empty">Select a conversation.</div></section></main><main id="metricView" hidden><section class="metric-controls"><input id="metricSearch" type="search" placeholder="Search axis, sub-axis, variant, conversation or turn"><select id="metricResult"><option value="ALL">All metric verdicts</option><option value="SOURCE_FAIL">Source FAIL</option><option value="SOURCE_PASS">Source PASS</option><option value="GOLDEN_FAIL">Golden FAIL</option><option value="GOLDEN_PASS">Golden PASS</option></select><select id="axis"><option value="ALL">All axes</option></select><select id="subaxis"><option value="ALL">All sub-axes</option></select><select id="variant"><option value="ALL">All variants</option></select></section><section id="metricSummary"></section><section class="table-wrap"><table><thead><tr><th>Conversation</th><th>Turn</th><th>Action</th><th>Axis</th><th>Sub-axis</th><th>Variant</th><th>Source</th><th>Golden</th><th>Severity</th><th>Confidence</th></tr></thead><tbody id="metricRows"></tbody></table></section></main><script src="/app.js" defer></script></body></html>
