<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Zen Conversation Review</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">ZEN DATA ENGINE</p>
      <h1>Golden conversation review</h1>
      <p class="subtitle">Verified candidates awaiting human judgment</p>
    </div>
    <div id="summary" class="summary"></div>
  </header>
  <main>
    <aside>
      <label for="statusFilter">Status</label>
      <select id="statusFilter">
        <option value="ALL">All candidates</option>
        <option value="READY_FOR_HUMAN_REVIEW">Ready for review</option>
        <option value="QUARANTINED">Quarantined</option>
      </select>
      <label for="search">Search metadata</label>
      <input id="search" type="search" placeholder="Domain, language, agent…">
      <div id="conversationList" class="conversation-list"></div>
    </aside>
    <section id="detail" class="detail" aria-live="polite">
      <div class="empty">Select a conversation to inspect its evidence.</div>
    </section>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
